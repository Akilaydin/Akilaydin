<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Abstract mountain banner</title>
  <desc id="desc">A muted mountain landscape banner for Artem Ovchinnikov's GitHub profile.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce6ec"/>
      <stop offset="0.55" stop-color="#edf2f5"/>
      <stop offset="1" stop-color="#cbd9e2"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aabb6"/>
      <stop offset="1" stop-color="#c2cdd4"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#708691"/>
      <stop offset="1" stop-color="#9fb0b8"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#415963"/>
      <stop offset="1" stop-color="#6f838c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" fill="url(#sky)"/>
  <circle cx="875" cy="54" r="42" fill="#ffffff" opacity="0.42"/>

  <path d="M0 151 L110 88 L188 126 L282 60 L360 118 L447 72 L532 134 L620 79 L704 123 L796 68 L888 128 L977 82 L1060 126 L1140 76 L1200 111 L1200 210 L0 210 Z"
