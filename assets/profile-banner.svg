  <path d="M0 170 L95 119 L173 156 L263 92 L352 153 L432 103 L515 164 L603 116 L693 158 L780 108 L871 160 L953 119 L1040 164 L1112 121 L1200 155 L1200 210 L0 210 Z"
        fill="url(#mid)" opacity="0.86"/>
  <path d="M0 187 L82 151 L148 179 L221 133 L300 182 L376 145 L456 187 L548 148 L632 184 L708 147 L798 189 L884 154 L961 186 L1041 151 L1120 186 L1200 160 L1200 210 L0 210 Z"
        fill="url(#near)"/>

  <g fill="#2f3d45" opacity="0.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="5">
    <text x="600" y="68" text-anchor="middle">DISTRIBUTED</text>
    <text x="600" y="88" text-anchor="middle">BACKEND</text>
    <text x="600" y="108" text-anchor="middle">SYSTEMS</text>
    <text x="600" y="128" text-anchor="middle">.NET</text>
  </g>
  <rect x="584" y="143" width="32" height="2" rx="1" fill="#2f3d45" opacity="0.55"/>
