<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 88" role="img" aria-labelledby="title desc">
  <title id="title">Senior backend engineer</title>
  <desc id="desc">Senior backend engineer with 6+ years of experience, working on a platform team and building distributed services in .NET.</desc>
  <style>
    text {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 27px;
      font-weight: 600;
    }

    .fade {
      animation: fade-in 900ms ease-out both;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; }
    }
  </style>

  <g class="fade">
    <text x="0" y="32">Senior backend engineer with 6+ years of experience, working on a platform team</text>
    <text x="0" y="70">and building distributed services in .NET.</text>
  </g>
</svg>